    <style>
    ul {
        list-style-type: none;
        margin: 0px;
        padding: 0px;
    }
    li {
        position: relative;
        float: left;
        text-align: center;
        margin-right: 3px;
        width: 100px;
        height: 20px;
        border: dotted;
        border-color: gray;
    }
    li:hover > a {
        background-color: black;
        color: white;
    }
    a {
        display: block;
        width: 100%;
        height: 100%;
        text-decoration: none;
        color: black;
    }
    li ul {
        display: none;
        position: absolute;
        top: 20px;
        left: 0;
    }
    li:hover ul {
        display: block;
    }
    </style>
    <body>
        <ul>
            <li><a>Home</a></li>
            <li><a>News</a>
                <ul>

            </li>
            <li><a>Contact</a></li>
