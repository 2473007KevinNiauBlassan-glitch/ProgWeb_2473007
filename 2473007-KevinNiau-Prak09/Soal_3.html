<!DOCTYPE html>
<html>
    <head>
        <title>2473007_Kevin Niau</title>
    </head>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        div {
            width: 40px;
            height: 40px;
            margin: 5px;
            float: left;
            border: 2px solid blue;
            text-align: center;
            margin-top: 50px;
        }
        span {
            color: red;
        }
    </style>
    <script>
        $(document).ready(function () {
            $("div").click(function () {
                $("div").css("background", "").removeAttr("id");
                $(this).css("background", "red")
                    .attr("id", "selected");
            });
            $("button").click(function () {
                $("div").each(function (index, domEle) {
                    if ($(domEle).attr("id") === "selected") {
                        return false;
                    }
                    $(domEle).css("background", "yellow");
                });
            });
        });
    </script>
    <body>
        <button>Change Colors</button>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </body>
</html>
