<!DOCTYPE html>
<html>
    <head>
        <title>2473007_Kevin Niau</title>
    </head>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $(".button").click(function () {
                var flag = $(this).is(":checked");
                if (flag) {
                    check();
                } else {
                    uncheck();
                }
                console.log("Jumlah terpilih: " + checklength());
            });
            function check() {
                $("input:checkbox.body").prop("checked", true);
                $("input:checkbox.body").attr("checked", "checked");
            }
            function uncheck() {
                $("input:checkbox.body").prop("checked", false);
                $("input:checkbox.body").removeAttr("checked");
            }
            function checklength() {
                return $("input:checkbox.body:checked").length;
            }
        });
    </script>
    <body>
        <table border="1" cellpadding="0" cellspacing="0">
            <tr>
                <td width="50" align="center">
                    <input class="button" type="checkbox"/><br/>
                    <hr/>
                    <input class="body" type="checkbox" /><br />
                    <input class="body" type="checkbox" /><br />
                    <input class="body" type="checkbox" /><br />
                    <input class="body" type="checkbox" /><br />
                </td>
            </tr>
        </table>
    </body>
</html>
